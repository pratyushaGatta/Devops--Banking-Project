# =============================================================================
# Banking System - Common Application Configuration
# =============================================================================

# Server Configuration
server.port=${PORT:8080}

# Active Spring Profile
# Local development uses SQLite by default.
# Azure App Service will override this with SPRING_PROFILES_ACTIVE=azure.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# =============================================================================
# JPA / Hibernate Common Configuration
# =============================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# =============================================================================
# JWT Configuration
# =============================================================================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# =============================================================================
# Jackson Configuration
# =============================================================================
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSSZ

# =============================================================================
# Logging Configuration
# =============================================================================
logging.level.com.lalit.bank=${APPLICATION_LOG_LEVEL:INFO}
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}